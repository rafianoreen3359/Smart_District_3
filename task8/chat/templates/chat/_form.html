{% if form.non_field_errors %}
  <p class="field-error" role="alert">{{ form.non_field_errors|join:" " }}</p>
{% endif %}
{% for field in form %}
  <div class="field">
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<small class="help">{{ field.help_text|safe }}</small>{% endif %}
    {% for error in field.errors %}<small class="field-error" role="alert">{{ error }}</small>{% endfor %}
  </div>
{% endfor %}
