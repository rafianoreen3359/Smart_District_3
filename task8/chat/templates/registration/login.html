{% extends "chat/base.html" %}
{% block title %}Sign in · Relay{% endblock %}
{% block content %}
<section class="auth wrap">
  <div class="auth-card">
    <h1>Sign in</h1>
    <p class="auth-sub">Sign in to create rooms and chat with your team.</p>
    <form method="post" novalidate>
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      {% include "chat/_form.html" %}
      <button type="submit" class="btn primary block">Sign in</button>
    </form>
    <p class="auth-alt">New here? <a href="{% url 'signup' %}">Create an account</a></p>
  </div>
</section>
{% endblock %}
