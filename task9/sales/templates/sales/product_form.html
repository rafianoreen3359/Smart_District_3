{% extends "sales/base.html" %}
{% block title %}Add product{% endblock %}
{% block content %}
<div class="narrow">
  <h1>Add a product</h1>
  <p class="muted">We create thumbnail, medium and large versions in parallel.</p>
  <form method="post" enctype="multipart/form-data" class="card form" novalidate>
    {% csrf_token %}
    {% for f in form %}
      <div class="field {% if f.errors %}field--err{% endif %}"><label for="{{ f.id_for_label }}">{{ f.label }}</label>{{ f }}
      {% for e in f.errors %}<p class="err">{{ e }}</p>{% endfor %}</div>
    {% endfor %}
    <button class="btn btn--block" type="submit">Upload &amp; process</button>
  </form>
</div>
{% endblock %}
