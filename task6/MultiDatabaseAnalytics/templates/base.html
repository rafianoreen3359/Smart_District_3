
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Analytics App{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <nav class="navbar">
        <h2>MultiDB Analytics</h2>

        <div>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'report' %}">Analytics Report</a>
            <a href="/admin/">Admin</a>
        </div>
    </nav>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>Multi-Database Analytics App | Django Project</p>
    </footer>

</body>
</html>
