<div style="font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;max-width:520px;margin:0 auto;color:#0a2540">
  <div style="padding:20px 24px;background:#0a2540;color:#fff;border-radius:10px 10px 0 0;font-weight:700;font-size:18px">Ledgerline</div>
  <div style="padding:24px;border:1px solid #e3e8ee;border-top:0;border-radius:0 0 10px 10px">
    <h2 style="margin:0 0 4px;font-size:20px">{{ heading }}</h2>
    <p style="margin:0 0 20px;color:#697386">Hi {{ user.get_short_name|default:user.get_username }} · {{ period }}</p>
    <table width="100%" cellpadding="10" style="border-collapse:collapse;font-size:15px">
      <tr style="border-bottom:1px solid #e3e8ee"><td>Reports requested</td><td align="right"><b>{{ stats.total }}</b></td></tr>
      <tr style="border-bottom:1px solid #e3e8ee"><td>Completed</td><td align="right" style="color:#0e9f6e"><b>{{ stats.done }}</b></td></tr>
      <tr style="border-bottom:1px solid #e3e8ee"><td>Failed</td><td align="right" style="color:#d92d20"><b>{{ stats.failed }}</b></td></tr>
      <tr><td>In progress</td><td align="right"><b>{{ stats.pending }}</b></td></tr>
    </table>
    <p style="margin:24px 0 0;font-size:12px;color:#8792a2">Change when you get this email under Settings → Digest.</p>
  </div>
</div>
