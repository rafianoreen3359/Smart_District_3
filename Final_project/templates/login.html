{% extends "auth_base.html" %}
{% block body %}
<div class="grid min-h-screen place-items-center bg-linear-to-br from-brand-50 to-white p-4">
  <form method="post" class="card w-full max-w-sm space-y-4">
    {% csrf_token %}
    <div class="text-center">
      <div class="mx-auto mb-2 grid h-10 w-10 place-items-center rounded-xl bg-brand-600 font-bold text-white">T</div>
      <h1 class="text-xl font-bold">Sign in to {{ WORKSPACE_NAME }}</h1>
    </div>
    {% if error %}<p class="rounded-lg bg-rose-50 p-2 text-sm text-rose-700">{{ error }}</p>{% endif %}
    <input name="email" type="email" required placeholder="Email" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
    <input name="password" type="password" required placeholder="Password" class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500">
    <button class="btn-primary w-full justify-center">Sign in</button>
  </form>
</div>
{% endblock %}
