<div
    style="font-family:Inter,Arial,sans-serif;max-width:480px;margin:auto;border:1px solid #e2e8f0;border-radius:12px;padding:24px">
    <h2 style="color:#4f46e5;margin:0 0 8px">New task assigned</h2>
    <p style="margin:0 0 16px">Hi {{ task.assignee.full_name|default:task.assignee.email }}, you were assigned:</p>
    <p style="font-weight:600;font-size:16px;margin:0">{{ task.title }}</p>
    <p style="color:#64748b;margin:4px 0 16px">{{ task.project.name }}{% if task.due_date %} · due {{
        task.due_date|date:"d M Y" }}{% endif %}</p>
    <a href="{{ url }}"
        style="background:#4f46e5;color:#fff;text-decoration:none;padding:10px 18px;border-radius:8px;display:inline-block">Open
        board</a>
</div>
